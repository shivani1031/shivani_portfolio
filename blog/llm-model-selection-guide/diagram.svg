<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">A repeatable way to choose a model</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">A repeatable way to choose a model</text>
<rect x="20" y="95" width="166" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="103.0" y="144.0" font-size="20" text-anchor="middle" fill="#ffffff">1 Define the</text>
<text x="103.0" y="170.0" font-size="20" text-anchor="middle" fill="#ffffff">job</text>
<line x1="189" y1="150" x2="215" y2="150" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="218" y="95" width="166" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="301.0" y="144.0" font-size="20" text-anchor="middle" fill="#ffffff">2 Apply hard</text>
<text x="301.0" y="170.0" font-size="20" text-anchor="middle" fill="#ffffff">constraints</text>
<line x1="387" y1="150" x2="413" y2="150" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="416" y="95" width="166" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="499.0" y="144.0" font-size="20" text-anchor="middle" fill="#ffffff">3 Build a</text>
<text x="499.0" y="170.0" font-size="20" text-anchor="middle" fill="#ffffff">test set</text>
<line x1="585" y1="150" x2="611" y2="150" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="614" y="95" width="166" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="697.0" y="144.0" font-size="20" text-anchor="middle" fill="#ffffff">4 Decide how</text>
<text x="697.0" y="170.0" font-size="20" text-anchor="middle" fill="#ffffff">to score</text>
<rect x="20" y="275" width="230" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="135.0" y="324.0" font-size="20" text-anchor="middle" fill="#ffffff">5 Run a fair</text>
<text x="135.0" y="350.0" font-size="20" text-anchor="middle" fill="#ffffff">comparison</text>
<line x1="253" y1="330" x2="282" y2="330" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="285" y="275" width="230" height="110" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="324.0" font-size="20" text-anchor="middle" fill="#080b0f">6 Cost per</text>
<text x="400.0" y="350.0" font-size="20" text-anchor="middle" fill="#080b0f">successful result</text>
<line x1="518" y1="330" x2="547" y2="330" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="550" y="275" width="230" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="665.0" y="324.0" font-size="20" text-anchor="middle" fill="#ffffff">7 Keep it</text>
<text x="665.0" y="350.0" font-size="20" text-anchor="middle" fill="#ffffff">replaceable</text>
<path d="M697 207 L697 240 L135 240 L135 271" fill="none" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
</g>
</svg>
