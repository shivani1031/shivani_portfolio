<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">What the command-line RAG chatbot does</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="48" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">What the command-line RAG chatbot does</text>
<text x="20" y="92" font-size="20" text-anchor="start" fill="#b3ff3a">Build the index</text>
<rect x="20.0" y="105" width="233.3" height="80" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="136.7" y="139.6" font-size="18" text-anchor="middle" fill="#ffffff">Folder of Markdown</text>
<text x="136.7" y="163.0" font-size="18" text-anchor="middle" fill="#ffffff">files</text>
<line x1="255.3" y1="145.0" x2="281.3" y2="145.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="283.3" y="105" width="233.3" height="80" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="139.6" font-size="18" text-anchor="middle" fill="#ffffff">Split into</text>
<text x="400.0" y="163.0" font-size="18" text-anchor="middle" fill="#ffffff">overlapping chunks</text>
<line x1="518.6" y1="145.0" x2="544.6" y2="145.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="546.7" y="105" width="233.3" height="80" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="663.4" y="127.9" font-size="18" text-anchor="middle" fill="#ffffff">Embed into an</text>
<text x="663.4" y="151.3" font-size="18" text-anchor="middle" fill="#ffffff">in-memory NumPy</text>
<text x="663.4" y="174.7" font-size="18" text-anchor="middle" fill="#ffffff">index</text>
<text x="20" y="250" font-size="20" text-anchor="start" fill="#b3ff3a">Answer a question</text>
<rect x="20.0" y="265" width="167.5" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="103.8" y="326.3" font-size="18" text-anchor="middle" fill="#ffffff">User question</text>
<line x1="189.5" y1="320.0" x2="215.5" y2="320.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="217.5" y="265" width="167.5" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="301.2" y="302.9" font-size="18" text-anchor="middle" fill="#ffffff">Embed it and</text>
<text x="301.2" y="326.3" font-size="18" text-anchor="middle" fill="#ffffff">score every</text>
<text x="301.2" y="349.7" font-size="18" text-anchor="middle" fill="#ffffff">chunk</text>
<line x1="387.0" y1="320.0" x2="413.0" y2="320.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="415.0" y="265" width="167.5" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="498.8" y="302.9" font-size="18" text-anchor="middle" fill="#ffffff">Best passages</text>
<text x="498.8" y="326.3" font-size="18" text-anchor="middle" fill="#ffffff">go to the</text>
<text x="498.8" y="349.7" font-size="18" text-anchor="middle" fill="#ffffff">model</text>
<line x1="584.5" y1="320.0" x2="610.5" y2="320.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="612.5" y="265" width="167.5" height="110" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="696.2" y="302.9" font-size="18" text-anchor="middle" fill="#080b0f">Answer that</text>
<text x="696.2" y="326.3" font-size="18" text-anchor="middle" fill="#080b0f">names its</text>
<text x="696.2" y="349.7" font-size="18" text-anchor="middle" fill="#080b0f">source files</text>
<path d="M 663.4 185 V 225 H 301.2 V 263" fill="none" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<text x="400" y="425" font-size="18" text-anchor="middle" fill="#ffffff">embed and call_llm are placeholders for your chosen models</text>
</g>
</svg>
