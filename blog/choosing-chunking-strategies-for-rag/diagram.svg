<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">A default path for chunking</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="48" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">A default path for chunking</text>
<rect x="20.0" y="90" width="233.3" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="136.7" y="147.0" font-size="20" text-anchor="middle" fill="#ffffff">Clean parsing</text>
<line x1="255.3" y1="140.0" x2="281.3" y2="140.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="283.3" y="90" width="233.3" height="100" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="121.0" font-size="20" text-anchor="middle" fill="#080b0f">Recursive or</text>
<text x="400.0" y="147.0" font-size="20" text-anchor="middle" fill="#080b0f">structure-aware</text>
<text x="400.0" y="173.0" font-size="20" text-anchor="middle" fill="#080b0f">chunking</text>
<line x1="518.6" y1="140.0" x2="544.6" y2="140.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="546.7" y="90" width="233.3" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="663.4" y="134.0" font-size="20" text-anchor="middle" fill="#ffffff">Attach title and</text>
<text x="663.4" y="160.0" font-size="20" text-anchor="middle" fill="#ffffff">section metadata</text>
<path d="M 663.4 190 V 222 H 220 V 248" fill="none" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<path d="M 580 222 V 248" fill="none" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="250" width="320" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="220.0" y="299.6" font-size="18" text-anchor="middle" fill="#ffffff">If answers lack context: add</text>
<text x="220.0" y="323.0" font-size="18" text-anchor="middle" fill="#ffffff">parent-child retrieval</text>
<rect x="420" y="250" width="320" height="110" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="580.0" y="287.9" font-size="18" text-anchor="middle" fill="#ffffff">If text has little structure</text>
<text x="580.0" y="311.3" font-size="18" text-anchor="middle" fill="#ffffff">and tests show a benefit: try</text>
<text x="580.0" y="334.7" font-size="18" text-anchor="middle" fill="#ffffff">semantic chunking</text>
<text x="400" y="415" font-size="18" text-anchor="middle" fill="#b3ff3a">Re-index and re-evaluate whenever the approach or model changes</text>
</g>
</svg>
