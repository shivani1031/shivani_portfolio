<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">PDF pipeline that keeps page numbers</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Poppins, sans-serif" fill="#ffffff" text-anchor="middle">
<text x="400" y="44" font-size="26" font-weight="600">PDF to cited answer, page by page</text>
<g fill="none" stroke="#ffffff" stroke-width="2">
<rect x="20" y="90" width="170" height="90" rx="10"/>
<rect x="230" y="90" width="170" height="90" rx="10"/>
<rect x="440" y="90" width="150" height="90" rx="10"/>
<rect x="630" y="90" width="150" height="90" rx="10"/>
<rect x="630" y="270" width="150" height="90" rx="10"/>
<rect x="400" y="270" width="190" height="90" rx="10" stroke="#b3ff3a"/>
<rect x="230" y="270" width="130" height="90" rx="10" stroke-dasharray="6 5"/>
</g>
<g font-size="21">
<text x="105" y="128">Load one</text><text x="105" y="156">page each</text>
<text x="315" y="128">Strip headers</text><text x="315" y="156">and page nos.</text>
<text x="515" y="128">Split</text><text x="515" y="156">into chunks</text>
<text x="705" y="128">Store</text><text x="705" y="156">with metadata</text>
<text x="705" y="308">Search</text><text x="705" y="336">filter by file</text>
<text x="495" y="308">Cite answer</text><text x="495" y="336">"file p.12"</text>
<text x="295" y="308">OCR</text><text x="295" y="336">queue</text>
</g>
<g stroke="#b3ff3a" stroke-width="3" fill="none" marker-end="url(#a)">
<path d="M190 135H226"/><path d="M400 135H436"/><path d="M590 135H626"/>
<path d="M705 180V266"/><path d="M630 315H594"/>
<path d="M105 180V315H226"/>
</g>
<text x="118" y="250" font-size="20" text-anchor="start">no text</text>
<text x="400" y="420" font-size="21">Every chunk carries source and page from the loader</text>
</g>
</svg>
