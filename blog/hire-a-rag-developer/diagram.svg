<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">How a RAG engagement usually runs</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">How a RAG engagement usually runs</text>
<rect x="20" y="130" width="140" height="150" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="90.0" y="186.0" font-size="20" text-anchor="middle" fill="#ffffff">Brief and</text>
<text x="90.0" y="212.0" font-size="20" text-anchor="middle" fill="#ffffff">sample</text>
<text x="90.0" y="238.0" font-size="20" text-anchor="middle" fill="#ffffff">documents</text>
