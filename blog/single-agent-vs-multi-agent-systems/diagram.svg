<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">A practical way to decide on more agents</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">A practical way to decide on more agents</text>
<rect x="20" y="120" width="131" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="85.5" y="186.0" font-size="20" text-anchor="middle" fill="#ffffff">Can it be</text>
<text x="85.5" y="212.0" font-size="20" text-anchor="middle" fill="#ffffff">a plain</text>
<text x="85.5" y="238.0" font-size="20" text-anchor="middle" fill="#ffffff">workflow?</text>
<line x1="153" y1="205" x2="175" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="177" y="120" width="131" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="242.5" y="199.0" font-size="20" text-anchor="middle" fill="#ffffff">Try one</text>
<text x="242.5" y="225.0" font-size="20" text-anchor="middle" fill="#ffffff">agent</text>
<line x1="310" y1="205" x2="332" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="334" y="120" width="131" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="399.5" y="186.0" font-size="20" text-anchor="middle" fill="#ffffff">Find the</text>
<text x="399.5" y="212.0" font-size="20" text-anchor="middle" fill="#ffffff">specific</text>
<text x="399.5" y="238.0" font-size="20" text-anchor="middle" fill="#ffffff">failure</text>
<line x1="468" y1="205" x2="490" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="492" y="120" width="131" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="557.5" y="199.0" font-size="20" text-anchor="middle" fill="#ffffff">Fix it</text>
<text x="557.5" y="225.0" font-size="20" text-anchor="middle" fill="#ffffff">simply</text>
<line x1="625" y1="205" x2="647" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="649" y="120" width="131" height="170" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="714.5" y="186.0" font-size="20" text-anchor="middle" fill="#080b0f">Split on</text>
<text x="714.5" y="212.0" font-size="20" text-anchor="middle" fill="#080b0f">a clear</text>
<text x="714.5" y="238.0" font-size="20" text-anchor="middle" fill="#080b0f">boundary</text>
<text x="400" y="350" font-size="20" text-anchor="middle" fill="#b3ff3a">Evaluate again after every change</text>
</g>
</svg>
