<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">LangChain RAG pipeline: load and split Markdown files, index chunks in a vector store, check retrieval, then answer with a two-step flow or an agent</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}.s{fill:#c9d1d9}.l{fill:#b3ff3a}</style>
<rect width="800" height="450" fill="#080b0f"/>
<text x="400" y="40" font-size="26" text-anchor="middle" class="l" font-weight="700">Minimal LangChain RAG pipeline</text>
<rect x="20" y="70" width="230" height="90" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="135.0" y="109.2" font-size="21" text-anchor="middle" font-weight="700">Markdown files</text>
<text x="135.0" y="135.5" font-size="21" text-anchor="middle">name kept as metadata</text>
<rect x="285" y="70" width="230" height="90" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="400.0" y="109.0" font-size="22" text-anchor="middle" font-weight="700">Split</text>
<text x="400.0" y="136.4" font-size="22" text-anchor="middle">into chunks</text>
<rect x="550" y="70" width="230" height="90" rx="10" fill="#11161c" stroke="#b3ff3a" stroke-width="2.5"/>
<text x="665.0" y="109.0" font-size="22" text-anchor="middle" font-weight="700">In-memory</text>
<text x="665.0" y="136.4" font-size="22" text-anchor="middle">vector store</text>
<path d="M250 115H283" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M515 115H548" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="400" y="195" width="380" height="70" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="590.0" y="224.2" font-size="21" text-anchor="middle" font-weight="700">Check retrieval alone</text>
<text x="590.0" y="250.5" font-size="21" text-anchor="middle">no chat model</text>
<path d="M665 160V193" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="20" y="305" font-size="22" text-anchor="start" class="l" font-weight="700">Answer step, two forms</text>
<rect x="20" y="325" width="370" height="105" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="205.0" y="358.6" font-size="21" text-anchor="middle" font-weight="700">Two-step flow</text>
<text x="205.0" y="384.9" font-size="21" text-anchor="middle">retrieval always runs,</text>
<text x="205.0" y="411.1" font-size="21" text-anchor="middle">model called once</text>
<rect x="410" y="325" width="370" height="105" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="595.0" y="358.6" font-size="21" text-anchor="middle" font-weight="700">Agent</text>
<text x="595.0" y="384.9" font-size="21" text-anchor="middle">model decides whether</text>
<text x="595.0" y="411.1" font-size="21" text-anchor="middle">and what to search</text>
<path d="M520 265L240 323" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M620 265V323" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
