<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">The model proposes, your application executes</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">The model proposes, your application executes</text>
<rect x="20" y="120" width="170" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="105.0" y="186.0" font-size="20" text-anchor="middle" fill="#ffffff">App</text>
<text x="105.0" y="212.0" font-size="20" text-anchor="middle" fill="#ffffff">describes</text>
<text x="105.0" y="238.0" font-size="20" text-anchor="middle" fill="#ffffff">the tools</text>
<line x1="192" y1="205" x2="214" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="216" y="120" width="170" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="301.0" y="186.0" font-size="20" text-anchor="middle" fill="#ffffff">Model</text>
<text x="301.0" y="212.0" font-size="20" text-anchor="middle" fill="#ffffff">returns a</text>
<text x="301.0" y="238.0" font-size="20" text-anchor="middle" fill="#ffffff">tool request</text>
<line x1="389" y1="205" x2="411" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="413" y="120" width="170" height="170" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="498.0" y="186.0" font-size="20" text-anchor="middle" fill="#080b0f">App</text>
<text x="498.0" y="212.0" font-size="20" text-anchor="middle" fill="#080b0f">validates</text>
<text x="498.0" y="238.0" font-size="20" text-anchor="middle" fill="#080b0f">and runs it</text>
<line x1="586" y1="205" x2="608" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="610" y="120" width="170" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="695.0" y="186.0" font-size="20" text-anchor="middle" fill="#ffffff">Result goes</text>
<text x="695.0" y="212.0" font-size="20" text-anchor="middle" fill="#ffffff">back to the</text>
<text x="695.0" y="238.0" font-size="20" text-anchor="middle" fill="#ffffff">model</text>
<text x="400" y="350" font-size="20" text-anchor="middle" fill="#b3ff3a">Reliability and security are enforced at that boundary</text>
</g>
</svg>
