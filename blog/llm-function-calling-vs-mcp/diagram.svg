<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">Function calling links the model and your app; MCP links your app's client, the MCP server and the tool. Tools are static per request in function calling and discovered at runtime with tools/list in MCP</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}.s{fill:#c9d1d9}.l{fill:#b3ff3a}</style>
<rect width="800" height="450" fill="#080b0f"/>
<text x="400" y="40" font-size="26" text-anchor="middle" class="l" font-weight="700">Function calling and MCP are separate layers</text>
<text x="215" y="82" font-size="20" text-anchor="middle" class="l" font-weight="700">Function calling (provider API)</text>
<path d="M25 92V100H405V92" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<rect x="20" y="115" width="165" height="100" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="102.5" y="146.1" font-size="21" text-anchor="middle" font-weight="700">Model</text>
<text x="102.5" y="172.3" font-size="21" text-anchor="middle">emits a</text>
<text x="102.5" y="198.6" font-size="21" text-anchor="middle">tool call</text>
<rect x="225" y="115" width="180" height="100" rx="10" fill="#11161c" stroke="#b3ff3a" stroke-width="2.5"/>
<text x="315.0" y="158.9" font-size="22" text-anchor="middle" font-weight="700">Your app</text>
<text x="315.0" y="186.4" font-size="22" text-anchor="middle">MCP client</text>
<rect x="445" y="115" width="170" height="100" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="530.0" y="172.7" font-size="22" text-anchor="middle" font-weight="700">MCP server</text>
<rect x="655" y="115" width="125" height="100" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="717.5" y="172.7" font-size="22" text-anchor="middle" font-weight="700">Tool</text>
<path d="M187 165H223" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M407 165H443" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M617 165H653" fill="none" stroke="#b3ff3a" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M230 230V238H610V230" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="420" y="262" font-size="20" text-anchor="middle" class="l" font-weight="700">MCP (tools/list, tools/call)</text>
<text x="400" y="298" font-size="22" text-anchor="middle" class="s" font-weight="700">How the tools are discovered</text>
<rect x="20" y="315" width="370" height="115" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="205.0" y="353.6" font-size="21" text-anchor="middle" font-weight="700">Function calling: static</text>
<text x="205.0" y="379.9" font-size="21" text-anchor="middle">your app supplies the</text>
<text x="205.0" y="406.1" font-size="21" text-anchor="middle">tools with each request</text>
<rect x="410" y="315" width="370" height="115" rx="10" fill="#11161c" stroke="#b3ff3a" stroke-width="2.5"/>
<text x="595.0" y="353.6" font-size="21" text-anchor="middle" font-weight="700">MCP: at runtime</text>
<text x="595.0" y="379.9" font-size="21" text-anchor="middle">the client asks the server</text>
<text x="595.0" y="406.1" font-size="21" text-anchor="middle">with tools/list</text>
</svg>
