<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">A FastAPI LLM chatbot request</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">A FastAPI LLM chatbot request</text>
<text x="30" y="100" font-size="20" text-anchor="start" fill="#b3ff3a">Before the response starts</text>
<rect x="20" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">POST /chat or</text>
<text x="109.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">/chat/stream</text>
<line x1="200" y1="160" x2="212" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Pydantic</text>
<text x="303.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">validates body</text>
<line x1="394" y1="160" x2="406" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Dependency</text>
<text x="497.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">loads history</text>
<line x1="588" y1="160" x2="600" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="115" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="154.0" font-size="20" text-anchor="middle" fill="#080b0f">Model call</text>
<text x="691.0" y="180.0" font-size="20" text-anchor="middle" fill="#080b0f">with timeout</text>
<text x="30" y="255" font-size="20" text-anchor="start" fill="#b3ff3a">/chat/stream after it starts</text>
<rect x="20" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">start event</text>
<text x="109.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">with the ID</text>
<line x1="200" y1="315" x2="212" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="270" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="309.0" font-size="20" text-anchor="middle" fill="#080b0f">token events</text>
<text x="303.0" y="335.0" font-size="20" text-anchor="middle" fill="#080b0f">as text comes</text>
<line x1="394" y1="315" x2="406" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">done or error</text>
<text x="497.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">event</text>
<line x1="588" y1="315" x2="600" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">History saved</text>
<text x="691.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">after done</text>
<text x="400" y="410" font-size="20" text-anchor="middle" fill="#ffffff">/chat returns JSON; before streaming, errors are 4xx or 5xx</text>
</g>
</svg>
