<rect x="30" y="168" width="300" height="70" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="180.0" y="210.0" font-size="20" text-anchor="middle" fill="#080b0f">A fixed taxonomy</text>
