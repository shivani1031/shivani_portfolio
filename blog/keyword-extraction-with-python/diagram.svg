<rect x="380" y="344" width="390" height="70" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="575.0" y="373.6" font-size="18" text-anchor="middle" fill="#ffffff">Terms comparable across documents,</text>
