<line x1="163" y1="315" x2="173" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="175" y="270" width="141" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="245.5" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Embed via</text>
<text x="245.5" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">Ollama</text>
<line x1="318" y1="315" x2="328" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="330" y="270" width="141" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.5" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Closest</text>
<text x="400.5" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">chunks</text>
<line x1="472" y1="315" x2="482" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="484" y="270" width="141" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="554.5" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Chat model</text>
<text x="554.5" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">via Ollama</text>
<line x1="627" y1="315" x2="637" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="639" y="270" width="141" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="709.5" y="309.0" font-size="20" text-anchor="middle" fill="#080b0f">Cited</text>
<text x="709.5" y="335.0" font-size="20" text-anchor="middle" fill="#080b0f">answer</text>
<text x="400" y="410" font-size="20" text-anchor="middle" fill="#ffffff">Everything runs on your own machine</text>
