<text x="497.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">Ollama</text>
<line x1="588" y1="160" x2="600" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="115" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="154.0" font-size="20" text-anchor="middle" fill="#080b0f">Local</text>
<text x="691.0" y="180.0" font-size="20" text-anchor="middle" fill="#080b0f">index</text>
<text x="30" y="255" font-size="20" text-anchor="start" fill="#b3ff3a">Answering (every question)</text>
<rect x="20" y="270" width="141" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
