<rect x="214" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Overlapping</text>
<text x="303.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">chunks</text>
<line x1="394" y1="160" x2="406" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
