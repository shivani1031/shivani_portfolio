<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">The loop at the centre of an agent</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">The loop at the centre of an agent</text>
<rect x="20" y="90" width="220" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="130.0" y="134.0" font-size="20" text-anchor="middle" fill="#ffffff">Read goal and</text>
<text x="130.0" y="160.0" font-size="20" text-anchor="middle" fill="#ffffff">state</text>
<rect x="290" y="90" width="220" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="147.0" font-size="20" text-anchor="middle" fill="#ffffff">Choose an action</text>
<rect x="560" y="90" width="220" height="100" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="670.0" y="121.0" font-size="20" text-anchor="middle" fill="#080b0f">Act: app</text>
<text x="670.0" y="147.0" font-size="20" text-anchor="middle" fill="#080b0f">validates and</text>
<text x="670.0" y="173.0" font-size="20" text-anchor="middle" fill="#080b0f">runs</text>
<line x1="244" y1="140" x2="286" y2="140" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<line x1="514" y1="140" x2="556" y2="140" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="560" y="250" width="220" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="670.0" y="294.0" font-size="20" text-anchor="middle" fill="#ffffff">Observe the</text>
<text x="670.0" y="320.0" font-size="20" text-anchor="middle" fill="#ffffff">result</text>
<line x1="670" y1="194" x2="670" y2="246" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="290" y="250" width="220" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="307.0" font-size="20" text-anchor="middle" fill="#ffffff">Repeat or stop?</text>
<line x1="556" y1="300" x2="514" y2="300" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<path d="M290 300 L130 300 L130 194" fill="none" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<text x="210" y="290" font-size="20" text-anchor="middle" fill="#b3ff3a">Repeat</text>
<line x1="400" y1="354" x2="400" y2="376" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<text x="400" y="405" font-size="20" text-anchor="middle" fill="#ffffff">Stop: final answer, human help or a limit</text>
</g>
</svg>
