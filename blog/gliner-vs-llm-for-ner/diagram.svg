<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">Two routes to named entities</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">Two routes to named entities</text>
<text x="30" y="100" font-size="20" text-anchor="start" fill="#b3ff3a">Compact model such as GLiNER</text>
<rect x="20" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Text +</text>
<text x="109.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">label names</text>
<line x1="200" y1="160" x2="212" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Small encoder</text>
<text x="303.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">model</text>
<line x1="394" y1="160" x2="406" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Scored spans</text>
<text x="497.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">per label</text>
<line x1="588" y1="160" x2="600" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="115" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="154.0" font-size="20" text-anchor="middle" fill="#080b0f">Entities</text>
<text x="691.0" y="180.0" font-size="20" text-anchor="middle" fill="#080b0f">in text</text>
<text x="30" y="255" font-size="20" text-anchor="start" fill="#b3ff3a">Prompted large language model</text>
<rect x="20" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Text, labels,</text>
<text x="109.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">examples</text>
<line x1="200" y1="315" x2="212" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="322.0" font-size="20" text-anchor="middle" fill="#ffffff">LLM call</text>
<line x1="394" y1="315" x2="406" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="322.0" font-size="20" text-anchor="middle" fill="#ffffff">JSON output</text>
<line x1="588" y1="315" x2="600" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="270" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="309.0" font-size="20" text-anchor="middle" fill="#080b0f">Check spans</text>
<text x="691.0" y="335.0" font-size="20" text-anchor="middle" fill="#080b0f">exist in text</text>
<text x="400" y="410" font-size="20" text-anchor="middle" fill="#ffffff">Both take label names at run time, so no retraining</text>
</g>
</svg>
