<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">Human approval with LangGraph interrupt</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">Human approval with LangGraph interrupt</text>
<text x="30" y="100" font-size="20" text-anchor="start" fill="#b3ff3a">First invoke: the run pauses</text>
<rect x="20" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Agent node</text>
<text x="109.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">proposes</text>
<line x1="200" y1="160" x2="212" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">review node:</text>
<text x="303.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">interrupt()</text>
<line x1="394" y1="160" x2="406" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="115" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="154.0" font-size="20" text-anchor="middle" fill="#080b0f">Checkpoint</text>
<text x="497.0" y="180.0" font-size="20" text-anchor="middle" fill="#080b0f">by thread ID</text>
<line x1="588" y1="160" x2="600" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Reviewer sees</text>
<text x="691.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">the payload</text>
<text x="30" y="255" font-size="20" text-anchor="start" fill="#b3ff3a">Second invoke: Command(resume=...)</text>
<rect x="20" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Same thread ID</text>
<text x="109.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">+ decision</text>
<line x1="200" y1="315" x2="212" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">review node</text>
<text x="303.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">runs again</text>
<line x1="394" y1="315" x2="406" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="270" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="309.0" font-size="20" text-anchor="middle" fill="#080b0f">Command(goto)</text>
<text x="497.0" y="335.0" font-size="20" text-anchor="middle" fill="#080b0f">picks a route</text>
<line x1="588" y1="315" x2="600" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">execute or</text>
<text x="691.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">rejected node</text>
<text x="400" y="410" font-size="20" text-anchor="middle" fill="#ffffff">Approve, edit or reject: interrupt() returns the decision</text>
</g>
</svg>
