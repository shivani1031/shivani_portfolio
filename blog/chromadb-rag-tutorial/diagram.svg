<text x="303.0" y="167.0" font-size="20" text-anchor="middle" fill="#ffffff">embedding</text>
<line x1="394" y1="160" x2="406" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">metadata</text>
<text x="497.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">source, date</text>
<line x1="588" y1="160" x2="600" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="115" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="154.0" font-size="20" text-anchor="middle" fill="#080b0f">Collection</text>
<text x="691.0" y="180.0" font-size="20" text-anchor="middle" fill="#080b0f">saved on disk</text>
<text x="30" y="255" font-size="20" text-anchor="start" fill="#b3ff3a">Query at question time</text>
<rect x="20" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Question</text>
<text x="109.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">embedding</text>
<line x1="200" y1="315" x2="212" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">where filter</text>
<text x="303.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">on metadata</text>
<line x1="394" y1="315" x2="406" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="270" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="309.0" font-size="20" text-anchor="middle" fill="#080b0f">Closest</text>
<text x="497.0" y="335.0" font-size="20" text-anchor="middle" fill="#080b0f">matches</text>
<line x1="588" y1="315" x2="600" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Text, source,</text>
<text x="691.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">distance</text>
<text x="400" y="410" font-size="20" text-anchor="middle" fill="#ffffff">Filters narrow the search before results reach the model</text>
