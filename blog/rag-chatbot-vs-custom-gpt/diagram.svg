<text x="600.0" y="134.0" font-size="20" text-anchor="middle" font-weight="700">You</text>
<text x="20" y="189" font-size="19" text-anchor="start" class="">Parsing, splitting</text>
<rect x="210" y="160" width="160" height="44" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="290.0" y="189.0" font-size="20" text-anchor="middle" font-weight="700">Vendor</text>
<rect x="520" y="160" width="160" height="44" rx="10" fill="#11161c" stroke="#b3ff3a" stroke-width="2.5"/>
<text x="600.0" y="189.0" font-size="20" text-anchor="middle" font-weight="700">You</text>
<text x="20" y="244" font-size="19" text-anchor="start" class="">Search</text>
<rect x="210" y="215" width="160" height="44" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
