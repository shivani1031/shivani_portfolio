<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
<title id="t">Comparison of control: with a custom GPT you supply instructions and files while the vendor owns parsing, search, model, interface and logging; with your own RAG chatbot you control every layer</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}.s{fill:#c9d1d9}.l{fill:#b3ff3a}</style>
<rect width="800" height="450" fill="#080b0f"/>
<text x="400" y="40" font-size="26" text-anchor="middle" class="l" font-weight="700">Who controls each layer?</text>
<text x="290" y="85" font-size="22" text-anchor="middle" class="l" font-weight="700">Custom GPT</text>
<text x="600" y="85" font-size="22" text-anchor="middle" class="l" font-weight="700">Your RAG chatbot</text>
<text x="20" y="134" font-size="19" text-anchor="start" class="">Instructions, files</text>
