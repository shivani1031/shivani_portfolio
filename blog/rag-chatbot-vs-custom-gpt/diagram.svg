<text x="600.0" y="244.0" font-size="20" text-anchor="middle" font-weight="700">You</text>
<text x="20" y="299" font-size="19" text-anchor="start" class="">Model</text>
<rect x="210" y="270" width="160" height="44" rx="10" fill="#11161c" stroke="#3a4450" stroke-width="1.5"/>
<text x="290.0" y="299.0" font-size="20" text-anchor="middle" font-weight="700">Vendor</text>
