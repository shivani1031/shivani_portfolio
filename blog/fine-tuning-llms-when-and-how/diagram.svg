<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">Fine-tuning in six steps</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="48" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">Fine-tuning in six steps</text>
<rect x="20.0" y="90" width="233.3" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="136.7" y="121.0" font-size="20" text-anchor="middle" fill="#ffffff">1. Define the task</text>
<text x="136.7" y="147.0" font-size="20" text-anchor="middle" fill="#ffffff">and collect</text>
<text x="136.7" y="173.0" font-size="20" text-anchor="middle" fill="#ffffff">examples</text>
<line x1="255.3" y1="140.0" x2="281.3" y2="140.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="283.3" y="90" width="233.3" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="134.0" font-size="20" text-anchor="middle" fill="#ffffff">2. Clean and split</text>
<text x="400.0" y="160.0" font-size="20" text-anchor="middle" fill="#ffffff">the data</text>
<line x1="518.6" y1="140.0" x2="544.6" y2="140.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="546.7" y="90" width="233.3" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="663.4" y="134.0" font-size="20" text-anchor="middle" fill="#ffffff">3. Format the</text>
<text x="663.4" y="160.0" font-size="20" text-anchor="middle" fill="#ffffff">examples</text>
<path d="M 663.4 190 V 225 H 136.7 V 258" fill="none" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="20.0" y="260" width="233.3" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="136.7" y="317.0" font-size="20" text-anchor="middle" fill="#ffffff">4. Start small</text>
<line x1="255.3" y1="310.0" x2="281.3" y2="310.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="283.3" y="260" width="233.3" height="100" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="304.0" font-size="20" text-anchor="middle" fill="#080b0f">5. Evaluate</text>
<text x="400.0" y="330.0" font-size="20" text-anchor="middle" fill="#080b0f">against a baseline</text>
<line x1="518.6" y1="310.0" x2="544.6" y2="310.0" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="546.7" y="260" width="233.3" height="100" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="663.4" y="304.0" font-size="20" text-anchor="middle" fill="#ffffff">6. Ship and keep</text>
<text x="663.4" y="330.0" font-size="20" text-anchor="middle" fill="#ffffff">watching</text>
<text x="400" y="420" font-size="18" text-anchor="middle" fill="#b3ff3a">Keep the baseline available as a fallback</text>
</g>
</svg>
