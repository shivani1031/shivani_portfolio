<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">An approval workflow in production</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">An approval workflow in production</text>
<text x="30" y="100" font-size="20" text-anchor="start" fill="#b3ff3a">Low-risk actions skip the queue</text>
<rect x="20" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Agent proposes</text>
<text x="109.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">an action</text>
<line x1="200" y1="160" x2="212" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="115" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="154.0" font-size="20" text-anchor="middle" fill="#080b0f">Policy check</text>
<text x="303.0" y="180.0" font-size="20" text-anchor="middle" fill="#080b0f">in code</text>
<line x1="394" y1="160" x2="406" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Needs review:</text>
<text x="497.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">add to queue</text>
<line x1="588" y1="160" x2="600" y2="160" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="115" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="154.0" font-size="20" text-anchor="middle" fill="#ffffff">Notify the</text>
<text x="691.0" y="180.0" font-size="20" text-anchor="middle" fill="#ffffff">right reviewer</text>
<text x="30" y="255" font-size="20" text-anchor="start" fill="#b3ff3a">After a decision</text>
<rect x="20" y="270" width="178" height="90" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="109.0" y="309.0" font-size="20" text-anchor="middle" fill="#080b0f">Approve, edit</text>
<text x="109.0" y="335.0" font-size="20" text-anchor="middle" fill="#080b0f">or reject</text>
<line x1="200" y1="315" x2="212" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="214" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="303.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Run what was</text>
<text x="303.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">approved</text>
<line x1="394" y1="315" x2="406" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="408" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="497.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Check the</text>
<text x="497.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">result</text>
<line x1="588" y1="315" x2="600" y2="315" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="602" y="270" width="178" height="90" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="691.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">Audit log</text>
<text x="691.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">entry</text>
<text x="400" y="410" font-size="20" text-anchor="middle" fill="#ffffff">No reply in time: remind, escalate, then expire unrun</text>
</g>
</svg>
