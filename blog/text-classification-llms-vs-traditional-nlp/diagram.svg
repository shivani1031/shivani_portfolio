<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">A cascade sends each text to the cheapest method</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">A cascade sends each text to the cheapest method</text>
<rect x="20" y="120" width="170" height="170" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="105.0" y="186.0" font-size="20" text-anchor="middle" fill="#080b0f">Rules:</text>
<text x="105.0" y="212.0" font-size="20" text-anchor="middle" fill="#080b0f">unambiguous</text>
<text x="105.0" y="238.0" font-size="20" text-anchor="middle" fill="#080b0f">cases</text>
<line x1="192" y1="205" x2="214" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="216" y="120" width="170" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="301.0" y="173.0" font-size="20" text-anchor="middle" fill="#ffffff">Trained</text>
<text x="301.0" y="199.0" font-size="20" text-anchor="middle" fill="#ffffff">model:</text>
<text x="301.0" y="225.0" font-size="20" text-anchor="middle" fill="#ffffff">confident</text>
<text x="301.0" y="251.0" font-size="20" text-anchor="middle" fill="#ffffff">common cases</text>
<line x1="389" y1="205" x2="411" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="413" y="120" width="170" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="498.0" y="199.0" font-size="20" text-anchor="middle" fill="#ffffff">LLM: harder</text>
<text x="498.0" y="225.0" font-size="20" text-anchor="middle" fill="#ffffff">cases</text>
<line x1="586" y1="205" x2="608" y2="205" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="610" y="120" width="170" height="170" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="695.0" y="186.0" font-size="20" text-anchor="middle" fill="#ffffff">Person:</text>
<text x="695.0" y="212.0" font-size="20" text-anchor="middle" fill="#ffffff">uncertain or</text>
<text x="695.0" y="238.0" font-size="20" text-anchor="middle" fill="#ffffff">high-risk</text>
<text x="400" y="350" font-size="20" text-anchor="middle" fill="#b3ff3a">Whatever a stage cannot settle passes to the next</text>
</g>
</svg>
