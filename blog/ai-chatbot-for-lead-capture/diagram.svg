<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">How a lead capture chatbot works</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3ff3a"/></marker></defs>
<rect width="800" height="450" fill="#080b0f"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
<text x="400" y="50" font-size="28" text-anchor="middle" fill="#ffffff" font-weight="bold">How a lead capture chatbot works</text>
<rect x="20" y="110" width="141" height="130" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="90.5" y="169.0" font-size="20" text-anchor="middle" fill="#ffffff">Visitor</text>
<text x="90.5" y="195.0" font-size="20" text-anchor="middle" fill="#ffffff">asks</text>
<line x1="163" y1="175" x2="173" y2="175" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="175" y="110" width="141" height="130" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="245.5" y="156.0" font-size="20" text-anchor="middle" fill="#ffffff">Answer</text>
<text x="245.5" y="182.0" font-size="20" text-anchor="middle" fill="#ffffff">from your</text>
<text x="245.5" y="208.0" font-size="20" text-anchor="middle" fill="#ffffff">content</text>
<line x1="318" y1="175" x2="328" y2="175" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="330" y="110" width="141" height="130" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.5" y="156.0" font-size="20" text-anchor="middle" fill="#ffffff">Offer next</text>
<text x="400.5" y="182.0" font-size="20" text-anchor="middle" fill="#ffffff">step and</text>
<text x="400.5" y="208.0" font-size="20" text-anchor="middle" fill="#ffffff">qualify</text>
<line x1="472" y1="175" x2="482" y2="175" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="484" y="110" width="141" height="130" rx="10" fill="#b3ff3a" stroke="#b3ff3a" stroke-width="2"/>
<text x="554.5" y="169.0" font-size="20" text-anchor="middle" fill="#080b0f">Ask for</text>
<text x="554.5" y="195.0" font-size="20" text-anchor="middle" fill="#080b0f">consent</text>
<line x1="627" y1="175" x2="637" y2="175" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<rect x="639" y="110" width="141" height="130" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="709.5" y="169.0" font-size="20" text-anchor="middle" fill="#ffffff">Hand to a</text>
<text x="709.5" y="195.0" font-size="20" text-anchor="middle" fill="#ffffff">person</text>
<rect x="250" y="280" width="300" height="70" rx="10" fill="none" stroke="#b3ff3a" stroke-width="2"/>
<text x="400.0" y="309.0" font-size="20" text-anchor="middle" fill="#ffffff">WhatsApp or email</text>
<text x="400.0" y="335.0" font-size="20" text-anchor="middle" fill="#ffffff">with a summary</text>
<line x1="708" y1="242" x2="552" y2="300" stroke="#b3ff3a" stroke-width="3" marker-end="url(#a)"/>
<text x="400" y="410" font-size="20" text-anchor="middle" fill="#b3ff3a">Measure each step, not just chats started</text>
</g>
</svg>
